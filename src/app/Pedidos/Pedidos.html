<div class="contenedor-vistas-pedidos">
    <!-- Administrador: todos los pedidos de todas las sucursales -->
    <app-admin-pedidos *hasRole="'admin'"></app-admin-pedidos>

    <!-- Trabajador: pedidos de su sucursal y cambio de estado -->
    <app-trabajador-pedidos *hasRole="'trabajador'"></app-trabajador-pedidos>

    <!-- Cliente: seguimiento de sus propios pedidos -->
    <app-cliente-pedidos *hasRole="'cliente'"></app-cliente-pedidos>
</div>
